services:
  postgres:
    # TimescaleDB on PG16 — drop-in replacement for postgres:16.
    # If upgrading from postgres:16: docker-compose down (keep volume),
    # swap the image, then docker-compose up. Run setup-timescale once.
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quantblocks
      POSTGRES_PASSWORD: quantblocks
      POSTGRES_DB: quantblocks
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quantblocks-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redis-data:
