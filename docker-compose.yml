services:
  postgres:
    # TimescaleDB on PG16 — drop-in replacement for postgres:16.
    # If upgrading from postgres:16: docker-compose down (keep volume),
    # swap the image, then docker-compose up. Run setup-timescale once.
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quantblocks
      POSTGRES_PASSWORD: quantblocks
      POSTGRES_DB: quantblocks
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
